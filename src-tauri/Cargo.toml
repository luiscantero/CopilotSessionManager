[package]
name = "copilot-session-search"
version = "0.3.0"
description = "Search local GitHub Copilot sessions"
edition = "2021"
publish = false

[lib]
name = "copilot_session_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8.2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
