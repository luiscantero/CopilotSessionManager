[package]
name = "copilot-session-search"
version = "0.3.0"
description = "Search local GitHub Copilot sessions"
edition = "2021"
publish = false

[lib]
name = "copilot_session_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "copilot-session-search"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
# The desktop app. Without it the crate only provides the search core and the JSON sidecar
# (`run_sidecar`) used by the VS Code extension.
gui = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8.2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
