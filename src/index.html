<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copilot Session Search</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <div class="heading">
          <span class="title">Sessions</span>
          <span id="count" class="count"></span>
        </div>
        <div class="actions">
          <button id="toggle-done" class="icon-button" type="button" aria-pressed="false" title="Show sessions marked as done">
            <span data-icon="checkAll"></span>
          </button>
          <button id="refresh" class="icon-button" type="button" title="Refresh sessions (F5)">
            <span data-icon="refresh"></span>
          </button>
        </div>
      </header>

      <div class="search-row">
        <label class="search-box">
          <span class="search-icon" data-icon="search"></span>
          <input
            id="search"
            type="text"
            placeholder="Filter by title or message (Ctrl+F)"
            spellcheck="false"
            autocomplete="off"
          />
          <button id="clear-search" class="icon-button small" type="button" title="Clear (Esc)" hidden>
            <span data-icon="close"></span>
          </button>
        </label>
      </div>

      <main id="columns" class="columns">
        <aside class="session-pane" aria-label="Sessions">
          <ul id="session-list" class="session-list" role="listbox" tabindex="0"></ul>
          <div id="list-empty" class="empty" hidden></div>
        </aside>
        <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
        <section class="chat-pane" aria-label="Conversation">
          <div id="chat-header" class="chat-header" hidden>
            <div id="chat-title" class="chat-title"></div>
            <div id="chat-meta" class="chat-meta"></div>
          </div>
          <div id="chat" class="chat">
            <div class="empty">Select a session to view the conversation.</div>
          </div>
        </section>
      </main>

      <footer class="statusbar">
        <div class="resume">
          <span class="prompt" data-icon="terminal"></span>
          <code id="resume-command" class="resume-command">No session selected</code>
          <button id="copy-resume" class="icon-button" type="button" title="Copy resume command" disabled>
            <span data-icon="copy"></span>
          </button>
        </div>
        <div class="session-actions">
          <button
            id="set-done"
            class="icon-button"
            type="button"
            title="Set as done (only available in VS Code for now)"
            aria-label="Set as done"
            disabled
          >
            <span data-icon="check"></span>
          </button>
          <button id="delete" class="icon-button danger" type="button" title="Delete session" disabled>
            <span data-icon="trash"></span>
          </button>
        </div>
      </footer>
    </div>

    <div id="dialog-backdrop" class="dialog-backdrop" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <h2 id="dialog-title">Delete session?</h2>
        <p id="dialog-text"></p>
        <p class="dialog-warning">This permanently removes the session folder. It cannot be undone.</p>
        <div class="dialog-buttons">
          <button id="dialog-cancel" class="button secondary" type="button">Cancel</button>
          <button id="dialog-confirm" class="button danger" type="button">Delete</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
    <script src="main.js"></script>
  </body>
</html>
