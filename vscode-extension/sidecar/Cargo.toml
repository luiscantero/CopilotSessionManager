[package]
name = "copilot-session-manager-sidecar"
version = "0.5.0"
description = "JSON stdio backend of the Session Manager for GitHub Copilot VS Code extension"
edition = "2021"
publish = false

[[bin]]
name = "copilot-session-manager-sidecar"
path = "src/main.rs"

[dependencies]
copilot-session-manager = { path = "../../src-tauri", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
